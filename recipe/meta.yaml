{% set version = "0.2.3" %}

package:
  name: parambokeh
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/p/parambokeh/parambokeh-{{ version }}.tar.gz
  sha256: 1b406581b85df5d955de8e744fce969b67e36e95ea3e3c496ec8e4e72029feaf

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - pyct-core >=0.4.4
  run:
    - python >={{ python_min }}
    - param >=1.7.0
    - bokeh >=0.12.10

test:
  requires:
    - python {{ python_min }}
  imports:
    - parambokeh

about:
  home: https://github.com/ioam/parambokeh
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Summary of the package
  doc_url: https://parambokeh.pyviz.org/
  dev_url: https://github.com/ioam/parambokeh

extra:
  recipe-maintainers:
    - ocefpaf
